<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chatopsy</title>
  <meta name="description" content="A tiny conversation autopsy panel." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="stage">
    <section class="window" aria-label="Chatopsy">
      <header class="topbar">
        <div class="brand">
          <span class="mark">C</span>
          <div>
            <strong>Chatopsy</strong>
            <small>conversation autopsy</small>
          </div>
        </div>
        <button id="clearBtn" class="ghost" type="button">clear</button>
      </header>

      <div class="workspace">
        <div id="feed" class="feed" aria-live="polite">
          <div class="intro">
            <span class="kicker">drop the evidence</span>
            <h1>Paste the chat.<br/>I’ll look for what changed.</h1>
            <p>No mind-reading. Just signals, competing interpretations, and uncertainty.</p>
          </div>
        </div>

        <div class="composer">
          <div class="phaseTools"><label class="attachBtn"><input id="imageInput" type="file" accept="image/*" multiple hidden>＋ screenshot</label><label class="personBox">person <input id="profileInput" maxlength="40" placeholder="optional"></label></div><div id="ocrStatus" class="ocrStatus" hidden></div><textarea id="chatInput" rows="4" spellcheck="false" placeholder="You: you still wanna go tomorrow?
Her: idk
You: everything okay?
Her: fine."></textarea>

          <div class="composerBar">
            <span id="messageCount">0 messages</span>
            <button id="analyzeBtn" class="send" type="button">run autopsy ↗</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
